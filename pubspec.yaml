name: j_dounts_app
description: "J'Dounts App - Rebuild for Coding Test"

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get_it: ^8.0.3
  intl: ^0.20.2
  equatable: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/nunito/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/nunito/Nunito-Bold.ttf
          weight: 700

    - family: NotoSansMyanmar
      fonts:
        - asset: assets/fonts/noto_sans_myanmar/NotoSansMyanmar-Regular.ttf
          weight: 400
        - asset: assets/fonts/noto_sans_myanmar/NotoSansMyanmar-Bold.ttf
          weight: 700
