name: j_dounts_app
description: "J'Dounts App - Rebuild for Coding Test"

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get_it: ^8.0.3
  intl: ^0.20.2
  equatable: ^3.0.0
  characters: ^1.4.1
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  cached_network_image: ^4.0.6
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.5
  go_router: ^18.1.3
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  connectivity_plus: ^7.3.2
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/seed/
    - assets/images/
    - assets/images/previews/
    - assets/images/placeholders/
    - assets/images/members/
    - assets/images/gifts/
    - assets/images/banners/
    - assets/images/shops/
    - assets/images/products/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/nunito/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/nunito/Nunito-Bold.ttf
          weight: 700

    - family: NotoSansMyanmar
      fonts:
        - asset: assets/fonts/noto_sans_myanmar/NotoSansMyanmar-Regular.ttf
          weight: 400
        - asset: assets/fonts/noto_sans_myanmar/NotoSansMyanmar-Bold.ttf
          weight: 700
